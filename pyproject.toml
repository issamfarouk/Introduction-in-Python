[project]
name = "finance-analyzer"
version = "0.1.0"
description = "Analyze bank transactions, detect recurring payments, and forecast your balance"
readme = "README.md"
authors = [
    { name = "Mohamed Gomaa", email = "mohamed.gomaa@tu-dortmund.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
