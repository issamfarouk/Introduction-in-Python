[project]
name = "finance-analyzer"
version = "0.1.0"
description = "Analyze bank transactions, detect recurring payments, and forecast your balance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mohamed Gomaa", email = "mohamed.gomaa@tu-dortmund.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.3,<3",
    "pandas>=3.0.6,<4",
]

[project.scripts]
finance-analyzer = "finance_analyzer.__main__:main"

[project.urls]
Homepage = "https://github.com/issamfarouk/finance-analyzer"
Issues = "https://github.com/issamfarouk/finance-analyzer/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
